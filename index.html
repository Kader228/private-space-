<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14204a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Private space</title>
<style>
:root{--bg:#fff;--soft:#fff0f5;--card:#fff;--tx:#14204a;--mut:#6b7499;--pk:#ff6f9f;--pkd:#e14a80;--nv:#14204a;--bd:#f6cfdd;--me:#14204a;--metx:#fff;--ot:#ffe0ea;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b12;--soft:#14204a;--card:#161d38;--tx:#fff;--mut:#a7b0d6;--bd:#2b3764;--me:#ff6f9f;--metx:#0b0b12;--ot:#1f2a52}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--nv);color:#fff}
header h1{margin:0;font:italic 700 1.4rem Georgia,"Times New Roman",serif}
header h1 span{color:var(--pk)}
#who{background:none;border:1px solid #ffffff55;color:#fff;border-radius:20px;padding:5px 12px;font-size:.85rem}
nav{display:flex;background:var(--soft);border-bottom:1px solid var(--bd)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mut);font-size:.95rem;border-bottom:3px solid transparent}
nav button.on{color:var(--tx);font-weight:700;border-bottom-color:var(--pk)}
main{flex:1;min-height:0;position:relative}
.view{display:none;position:absolute;inset:0;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.b{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--ot);white-space:pre-wrap;word-wrap:break-word}
.b.me{align-self:flex-end;background:var(--me);color:var(--metx)}
.b small{display:block;font-size:.7rem;opacity:.75;margin-top:2px}
.bar,.form{display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0));border-top:1px solid var(--bd);background:var(--bg)}
.form{flex-direction:column}
input,textarea{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);min-width:0}
.btn{padding:10px 16px;border:0;border-radius:12px;background:var(--pk);color:#14204a;font-weight:700;font-size:1rem}
.btn.nv{background:var(--nv);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.card h3{margin:0 0 2px;font:700 1.1rem Georgia,serif}
.card p{margin:6px 0 0;white-space:pre-wrap}
.card small,.mut{color:var(--mut)}
.x{float:right;background:none;border:0;color:var(--mut);font-size:1.1rem}
.empty{margin:auto;text-align:center;color:var(--mut);padding:20px}
.sub{display:flex;gap:6px;padding:8px 12px;overflow-x:auto}
.sub button{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.sub button.on{background:var(--pk);color:#14204a;border-color:var(--pk);font-weight:700}
.g{display:none;flex:1;overflow-y:auto;padding:4px 12px 16px;flex-direction:column;gap:10px}
.g.on{display:flex}
.opt{display:inline-block;margin:4px 6px 0 0;padding:8px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.opt.on{background:var(--nv);color:#fff;border-color:var(--nv)}
@media (prefers-color-scheme:dark){.opt.on{background:var(--pk);color:#0b0b12;border-color:var(--pk)}}
.big{font:italic 700 1.3rem/1.35 Georgia,serif;text-align:center;padding:18px 8px}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:300px;width:100%;margin:0 auto}
.ttt button{aspect-ratio:1;font-size:2.4rem;font-weight:700;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
#ov{position:fixed;inset:0;background:var(--nv);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:9}
#ov h2{font:italic 700 1.8rem Georgia,serif;margin:0}
#ov .btn{width:100%;max-width:300px;padding:16px;font-size:1.1rem}
#st{text-align:center;font-size:.8rem;color:var(--mut);padding:2px}
#ban{display:none;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;background:var(--pk);color:#14204a;font-size:.9rem}
#ban button{border:0;border-radius:14px;background:#14204a;color:#fff;padding:6px 12px}
.b img{display:block;max-width:100%;max-height:260px;border-radius:12px;margin-bottom:4px}
.b audio{display:block;max-width:100%;height:40px;margin-bottom:4px}
.ic{background:var(--soft);border:1px solid var(--bd);border-radius:12px;padding:0 12px;font-size:1.2rem;color:var(--tx)}
.ic.rec{background:#e14a4a;color:#fff;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.6}}
.gr{display:grid;gap:5px;margin:0 auto;width:100%}
.gr button{aspect-ratio:1;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1.3rem;padding:0}
.gr.c6{grid-template-columns:repeat(6,1fr);max-width:300px}
.gr.c7{grid-template-columns:repeat(7,1fr);max-width:340px}
.gr.c4m{grid-template-columns:repeat(4,1fr);max-width:300px}
.gr.c7 button{border-radius:50%;background:var(--soft)}
.gr button.on{background:var(--pk);border-color:var(--pk)}
.rps{display:flex;gap:10px;justify-content:center}
.rps button{font-size:2.6rem;padding:12px 18px;border-radius:16px;border:1px solid var(--bd);background:var(--card)}
.sc{text-align:center;color:var(--mut);margin:2px 0}
.btn:disabled{opacity:.45}
#big{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:8}
#big img{max-width:96%;max-height:92%}
#bell{background:none;border:1px solid #ffffff55;color:#fff;border-radius:20px;padding:5px 10px;font-size:.9rem}
</style>
</head>
<body>
<header><h1>Private <span>space</span></h1><div style="display:flex;gap:6px"><button id="bell">🔔</button><button id="who"></button></div></header>
<nav><button data-v="chat" class="on">💬 Discussion</button><button data-v="mem">📸 Souvenirs</button><button data-v="game">🎲 Jeux</button></nav>
<div id="ban"></div><div id="st"></div>
<main>
 <section class="view on" id="chat">
  <div class="scroll" id="msgs"></div>
  <div class="bar"><button class="ic" id="pb" aria-label="Photo">📷</button><input id="pf" type="file" accept="image/*" hidden><input id="mi" placeholder="Écris un message…" autocomplete="off"><button class="ic" id="mb2" aria-label="Vocal">🎤</button><button class="ic" id="mc" style="display:none" aria-label="Annuler">✕</button><button class="btn" id="ms" aria-label="Envoyer">➤</button></div>
 </section>
 <section class="view" id="mem">
  <div class="scroll" id="mems"></div>
  <div class="form">
   <input id="mt" placeholder="Titre du souvenir">
   <input id="md" type="date">
   <textarea id="mn" rows="2" placeholder="Raconte-le…"></textarea>
   <button class="btn" id="mb">Ajouter le souvenir</button>
  </div>
 </section>
 <section class="view" id="game">
  <div class="sub" id="sub">
   <button data-g="daily" class="on">Question du jour</button><button data-g="quiz">Quiz</button><button data-g="aov">Action ou vérité</button><button data-g="ttt">Morpion</button><button data-g="rps">Pierre-feuille-ciseaux</button><button data-g="c4">Puissance 4</button><button data-g="gmem">Mémoire</button><button data-g="bat">Bataille navale</button>
  </div>
  <div class="g on" id="daily"></div>
  <div class="g" id="quiz"></div>
  <div class="g" id="aov"></div>
  <div class="g" id="ttt"></div>
  <div class="g" id="rps"></div>
  <div class="g" id="c4"></div>
  <div class="g" id="gmem"></div>
  <div class="g" id="bat"></div>
 </section>
</main>
<div id="big"><img id="bigi" alt=""></div>
<div id="ov"><h2>Qui es-tu ?</h2><p>Choisis une seule fois, tu pourras changer plus tard.</p>
 <button class="btn" data-r="H">💙 Mon héros</button><button class="btn" data-r="P">💗 Ma princesse</button></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,addDoc,setDoc,deleteDoc,onSnapshot,query,orderBy,limit,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyA0N7SvD1Ucd-Vx3Z9dO759Ssli4eK5KT4",
  authDomain:"private-space-2.firebaseapp.com",
  projectId:"private-space-2",
  storageBucket:"private-space-2.firebasestorage.app",
  messagingSenderId:"91501099044",
  appId:"1:91501099044:web:d756400067436612fe00b1"
});
const db=getFirestore(app);
const $=i=>document.getElementById(i);
const NAMES={H:"Mon héros 💙",P:"Ma princesse 💗"};
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML};
const fmt=t=>{const d=new Date(t);return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let role=null;try{role=localStorage.getItem("role")}catch(e){}
const other=()=>role==="H"?"P":"H";
const err=m=>{$("st").textContent=m};

/* Qui es-tu */
function setRole(r){role=r;try{localStorage.setItem("role",r)}catch(e){}$("ov").style.display="none";$("who").textContent=NAMES[r];renderAll()}
$("ov").onclick=e=>{const r=e.target.getAttribute&&e.target.getAttribute("data-r");if(r)setRole(r)};
$("who").onclick=()=>{$("ov").style.display="flex"};
if(!role)$("ov").style.display="flex";else $("who").textContent=NAMES[role];

/* Onglets */
document.querySelector("nav").onclick=e=>{const v=e.target.getAttribute("data-v");if(!v)return;
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b===e.target));
 document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id===v));if(v==="chat"){unread=0;badge();markSeen()}updatePresence()};
$("sub").onclick=e=>{const g=e.target.getAttribute("data-g");if(!g)return;
 document.querySelectorAll("#sub button").forEach(b=>b.classList.toggle("on",b===e.target));
 document.querySelectorAll(".g").forEach(s=>s.classList.toggle("on",s.id===g));updatePresence()};

/* Discussion */
let msgs=[],unread=0,LIM=40,unChat=null,seenIds=null,later=false;const marking=new Set();
const safe=u=>/^data:(image|audio)\/[a-z0-9.+-]+(;[a-z0-9=.+-]+)*;base64,[A-Za-z0-9+\/=]+$/i.test(u||"")?u:"";
const tick=m=>m.role!==role?"":m.pend?" ⏳":m.seen?" ✓✓":" ✓";
function bubble(m){let c="";const im=safe(m.img),au=safe(m.aud);
 if(im)c+='<img src="'+im+'" data-big="1" alt="photo">';
 if(au)c+='<audio controls preload="none" src="'+au+'"></audio>';
 if(m.text)c+=esc(m.text);
 return '<div class="b'+(m.role===role?" me":"")+'">'+c+'<small>'+(m.role===role?"":NAMES[m.role]+" · ")+fmt(m.ts)+tick(m)+'</small></div>'}
function drawMsgs(){const el=$("msgs");
 if([...el.querySelectorAll("audio")].some(a=>!a.paused&&!a.ended)){later=true;return}
 later=false;const bottom=el.scrollHeight-el.scrollTop-el.clientHeight<80;
 el.innerHTML=(msgs.length>=LIM?'<button class="btn nv" data-more="1" style="align-self:center">Messages précédents</button>':"")+(msgs.length?msgs.map(bubble).join(""):'<div class="empty">Aucun message. Écris le premier mot doux 💌</div>');
 if(bottom||msgs.length<2)el.scrollTop=el.scrollHeight}
$("msgs").addEventListener("pause",()=>{if(later)drawMsgs()},true);
$("msgs").addEventListener("ended",()=>{if(later)drawMsgs()},true);
function chatVisible(){return !document.hidden&&$("chat").classList.contains("on")&&$("ov").style.display!=="flex"}
function badge(){document.title=(unread?"("+unread+") ":"")+"Private space";document.querySelector('nav button[data-v="chat"]').textContent="💬 Discussion"+(unread?" ("+unread+")":"")}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(a.currentTime+.15)}catch(e){}}
function alertNew(m){if(chatVisible())return;unread++;badge();beep();
 if(document.hidden&&"Notification" in window&&Notification.permission==="granted"){
  const body=m.text||(m.img?"📷 Photo":"🎤 Message vocal");
  if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(NAMES[m.role],{body,icon:"icon-192.png",tag:"msg"})).catch(()=>{});
  else try{new Notification(NAMES[m.role],{body})}catch(e){}}}
function markSeen(){if(!role||!chatVisible())return;
 msgs.forEach(m=>{if(m.role!==role&&!m.seen&&!m.pend&&!marking.has(m.id)){marking.add(m.id);setDoc(doc(db,"messages",m.id),{seen:true},{merge:true}).catch(()=>marking.delete(m.id))}})}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&chatVisible()){unread=0;badge();markSeen()}updatePresence()});
function subChat(){if(unChat)unChat();seenIds=null;
 unChat=onSnapshot(query(collection(db,"messages"),orderBy("ts","desc"),limit(LIM)),{includeMetadataChanges:true},s=>{
  err("");msgs=s.docs.map(d=>({id:d.id,pend:d.metadata.hasPendingWrites,...d.data()})).reverse();
  if(seenIds)msgs.forEach(m=>{if(!seenIds.has(m.id)&&m.role!==role&&!m.pend)alertNew(m)});
  seenIds=new Set(msgs.map(m=>m.id));markSeen();drawMsgs()},()=>err("Connexion impossible : vérifie les règles Firestore."))}
subChat();
$("bell").onclick=async()=>{if(!("Notification" in window))return alert("Ton navigateur ne gère pas les notifications.");
 const p=await Notification.requestPermission();$("bell").textContent=p==="granted"?"🔔 ✓":"🔕"};
if("Notification" in window&&Notification.permission==="granted")$("bell").textContent="🔔 ✓";
async function post(extra){if(!role)return;try{await addDoc(collection(db,"messages"),{role,ts:Date.now(),...extra})}catch(e){err("Message non envoyé.")}}
function send(){const v=$("mi").value.trim();if(!v)return;$("mi").value="";post({text:v})}
$("ms").onclick=send;$("mi").onkeydown=e=>{if(e.key==="Enter")send()};
$("msgs").onclick=e=>{const t=e.target;if(!t.getAttribute)return;
 if(t.getAttribute("data-more")){LIM+=40;subChat();return}
 if(t.getAttribute("data-big")){$("bigi").src=t.src;$("big").style.display="flex"}};
$("big").onclick=()=>{$("big").style.display="none"};
/* Photos */
const shrink=(f,max,q)=>new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q))};img.onerror=rej;img.src=u});
$("pb").onclick=()=>$("pf").click();
$("pf").onchange=async()=>{const f=$("pf").files[0];$("pf").value="";if(!f)return;
 try{let d="";for(const[m,q]of[[800,.55],[640,.5],[480,.45],[360,.4]]){d=await shrink(f,m,q);if(d.length<200000)break}
  if(d.length>=400000)return err("Photo trop lourde.");post({img:d})}catch(e){err("Photo illisible.")}};
/* Vocaux */
let rec=null,chunks=[],rt=null,rs=0,cancelled=false;
const mimeT=()=>["audio/webm;codecs=opus","audio/mp4","audio/webm"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||"";
function recUi(on){$("mb2").textContent=on?"⏹ 0s":"🎤";$("mb2").classList.toggle("rec",on);$("mc").style.display=on?"block":"none";$("mi").disabled=on;$("mi").placeholder=on?"Enregistrement…":"Écris un message…"}
async function startRec(){if(!window.MediaRecorder||!navigator.mediaDevices)return err("Vocaux indisponibles sur ce navigateur.");
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),mt=mimeT();
  rec=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});chunks=[];cancelled=false;
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(rt);recUi(false);if(cancelled)return;
   const fr=new FileReader();fr.onload=()=>{if(fr.result.length>600000)return err("Vocal trop long.");post({aud:fr.result})};
   fr.readAsDataURL(new Blob(chunks,{type:rec.mimeType||mt||"audio/webm"}))};
  rec.start();rs=0;recUi(true);rt=setInterval(()=>{rs++;$("mb2").textContent="⏹ "+rs+"s";if(rs>=30)stopRec()},1000)}
 catch(e){err("Micro refusé ou indisponible.")}}
function stopRec(){if(rec&&rec.state!=="inactive")rec.stop()}
$("mb2").onclick=()=>{rec&&rec.state==="recording"?stopRec():startRec()};
$("mc").onclick=()=>{cancelled=true;stopRec()};
/* Présence : qui joue à quoi */
const GL={daily:"Question du jour",quiz:"Quiz",aov:"Action ou vérité",ttt:"Morpion",rps:"Pierre-feuille-ciseaux",c4:"Puissance 4",gmem:"Mémoire",bat:"Bataille navale"};
let lastP="",lastT=0,pres={};
function curGame(){if(document.hidden||!role||!$("game").classList.contains("on"))return null;const b=document.querySelector("#sub button.on");return b?b.getAttribute("data-g"):null}
function updatePresence(){if(!role)return;const g=curGame(),k=String(g);
 if(k===lastP&&Date.now()-lastT<60000){drawBan();return}
 lastP=k;lastT=Date.now();setDoc(doc(db,"presence",role),{role,game:g,ts:Date.now()}).catch(()=>{});drawBan()}
function drawBan(){const o=pres[other()],b=$("ban");
 const on=!!(role&&o&&o.game&&GL[o.game]&&Date.now()-o.ts<120000&&curGame()!==o.game);
 b.style.display=on?"flex":"none";
 if(on)b.innerHTML='<span>'+NAMES[other()]+' joue : <b>'+GL[o.game]+'</b></span><button data-join="'+o.game+'">Rejoindre</button>'}
$("ban").onclick=e=>{const g=e.target.getAttribute&&e.target.getAttribute("data-join");if(!g||!GL[g])return;
 document.querySelector('nav button[data-v="game"]').click();document.querySelector('#sub button[data-g="'+g+'"]').click()};
onSnapshot(collection(db,"presence"),sn=>{pres={};sn.docs.forEach(d=>pres[d.id]=d.data());drawBan()},()=>{});
setInterval(updatePresence,30000);

/* Souvenirs */
let mems=[];
function drawMems(){$("mems").innerHTML=mems.length?mems.map(m=>'<div class="card">'+(m.role===role?'<button class="x" data-id="'+m.id+'" aria-label="Supprimer">✕</button>':"")+'<h3>'+esc(m.title)+'</h3><small>'+esc(m.date)+' · '+NAMES[m.role]+'</small>'+(m.note?'<p>'+esc(m.note)+'</p>':"")+'</div>').join(""):'<div class="empty">Pas encore de souvenir. Ajoute le premier 📸</div>'}
onSnapshot(query(collection(db,"memories"),orderBy("date","desc"),limit(300)),s=>{mems=s.docs.map(d=>({id:d.id,...d.data()}));drawMems()},()=>{});
$("md").value=today();
$("mb").onclick=async()=>{const t=$("mt").value.trim();if(!t||!role)return;
 try{await addDoc(collection(db,"memories"),{role,title:t,date:$("md").value,note:$("mn").value.trim(),ts:Date.now()});$("mt").value="";$("mn").value=""}catch(e){err("Ajout impossible.")}};
$("mems").onclick=async e=>{const id=e.target.getAttribute&&e.target.getAttribute("data-id");
 if(id&&confirm("Supprimer ce souvenir ?"))try{await deleteDoc(doc(db,"memories",id))}catch(x){err("Suppression impossible.")}};

/* Question du jour */
const QD=["Quel est ton plus beau souvenir avec moi ?","Qu'est-ce qui t'a fait craquer chez moi au début ?","Où aimerais-tu qu'on voyage ensemble ?","Quelle petite attention te fait le plus plaisir ?","Quel est ton plus grand rêve pour nous deux ?","Quelle chanson te fait penser à nous ?","Qu'est-ce que tu aimes le plus dans notre quotidien ?","Quel moment avec moi aimerais-tu revivre ?","Qu'est-ce qui te fait rire chez moi ?","Comment imagines-tu notre rendez-vous idéal ?","De quoi es-tu le plus fier(e) cette année ?","Quelle qualité admires-tu chez moi ?","Quel film aimerais-tu qu'on regarde ensemble ?","Qu'est-ce que tu voudrais qu'on apprenne à faire ensemble ?","Quel est ton souvenir d'enfance préféré ?","Qu'est-ce qui te rassure quand tu es triste ?","Quel mot décrit le mieux notre couple ?","Quelle habitude de moi te fait sourire ?","Que veux-tu qu'on fasse ce week-end ?","Qu'est-ce que tu me souhaites pour cette année ?"];
let daily={};
function drawDaily(){const q=QD[Math.floor(Date.now()/864e5)%QD.length];const mine=daily[role],oth=daily[other()];
 $("daily").innerHTML='<div class="big">'+esc(q)+'</div><textarea id="da" rows="3" placeholder="Ta réponse…">'+esc(mine||"")+'</textarea><button class="btn" id="ds">'+(mine?"Modifier ma réponse":"Envoyer ma réponse")+'</button>'+
 (mine&&oth?'<div class="card"><small>'+NAMES[other()]+'</small><p>'+esc(oth)+'</p></div>':'<p class="mut" style="text-align:center">'+(mine?"En attente de la réponse de l'autre… 💭":"Réponds pour découvrir la réponse de l'autre.")+'</p>');
 $("ds").onclick=async()=>{const v=$("da").value.trim();if(!v)return;try{await setDoc(doc(db,"daily",today()+"_"+role),{date:today(),role,answer:v})}catch(e){err("Réponse non envoyée.")}}}
onSnapshot(query(collection(db,"daily"),where("date","==",today())),s=>{daily={};s.docs.forEach(d=>{const x=d.data();daily[x.role]=x.answer});if(!document.activeElement||document.activeElement.id!=="da")drawDaily()},()=>{});

/* Quiz : qui connaît le mieux l'autre */
const QZ=[["Boisson préférée ?","Café","Thé","Jus","Soda"],["Saison préférée ?","Printemps","Été","Automne","Hiver"],["Soirée idéale ?","Film à la maison","Restaurant","Sortie entre amis","Balade"],["Vacances rêvées ?","Plage","Montagne","Grande ville","Campagne"],["Plat préféré ?","Pâtes","Riz","Viande grillée","Poisson"],["Tu es plutôt…","Du matin","Du soir","Les deux","Ça dépend"],["Cadeau préféré ?","Un objet","Une sortie","Un message doux","Un repas"],["Ta façon de dire je t'aime ?","Des mots","Des gestes","Des cadeaux","Du temps ensemble"]];
let quiz={},selS=[],selG=[];
function pick(arr,i,o){arr[i]=o}
function qHtml(sel,label){return QZ.map((q,i)=>'<div class="card"><b>'+esc(q[0])+'</b><br><small>'+label+'</small><div>'+q.slice(1).map((o,j)=>'<button class="opt'+(sel[i]===j?" on":"")+'" data-q="'+i+'" data-o="'+j+'">'+esc(o)+'</button>').join("")+'</div></div>').join("")}
function score(guess,self){return guess.reduce((n,g,i)=>n+(g===self[i]?1:0),0)}
function drawQuiz(){const me=quiz[role]||{},ot=quiz[other()]||{};let h="";
 if(!me.self){h='<p class="mut">Étape 1 : réponds pour toi.</p>'+qHtml(selS,"Ta réponse")+'<button class="btn" id="q1">Valider mes réponses</button>'}
 else if(!ot.self){h='<div class="empty">Tes réponses sont enregistrées ✅<br>Attends que l\'autre réponde à l\'étape 1.</div>'}
 else if(!me.guess){h='<p class="mut">Étape 2 : devine les réponses de l\'autre.</p>'+qHtml(selG,"Sa réponse selon toi")+'<button class="btn" id="q2">Valider mes devinettes</button>'}
 else if(!ot.guess){h='<div class="empty">Tes devinettes sont enregistrées ✅<br>Attends que l\'autre termine.</div>'}
 else{const a=score(me.guess,ot.self),b=score(ot.guess,me.self);
  h='<div class="big">'+NAMES[role]+' : '+a+'/'+QZ.length+'<br>'+NAMES[other()]+' : '+b+'/'+QZ.length+'</div><p style="text-align:center">'+(a>b?"Tu connais mieux l'autre 😏":a<b?"L'autre te connaît mieux 💕":"Égalité parfaite 💞")+'</p><button class="btn nv" id="qr">Rejouer</button>'}
 $("quiz").innerHTML=h;
 if($("q1"))$("q1").onclick=async()=>{if(selS.filter(x=>x!=null).length<QZ.length)return err("Réponds à toutes les questions.");err("");try{await setDoc(doc(db,"quiz",role),{...me,self:selS.slice()});selS=[]}catch(e){err("Erreur d'envoi.")}};
 if($("q2"))$("q2").onclick=async()=>{if(selG.filter(x=>x!=null).length<QZ.length)return err("Réponds à toutes les questions.");err("");try{await setDoc(doc(db,"quiz",role),{...me,guess:selG.slice()});selG=[]}catch(e){err("Erreur d'envoi.")}};
 if($("qr"))$("qr").onclick=async()=>{try{await deleteDoc(doc(db,"quiz","H"));await deleteDoc(doc(db,"quiz","P"))}catch(e){err("Erreur.")}}}
$("quiz").onclick=e=>{const q=e.target.getAttribute&&e.target.getAttribute("data-q");if(q==null)return;
 const me=quiz[role]||{};const arr=!me.self?selS:selG;arr[+q]=+e.target.getAttribute("data-o");
 e.target.parentNode.querySelectorAll(".opt").forEach(b=>b.classList.toggle("on",b===e.target))};
onSnapshot(collection(db,"quiz"),s=>{quiz={};s.docs.forEach(d=>quiz[d.id]=d.data());drawQuiz()},()=>{});

/* Action ou vérité */
const ACT=["Fais un câlin de 20 secondes.","Envoie un message vocal en chuchotant « je t'aime ».","Fais ton plus beau compliment à l'autre.","Imite l'autre pendant 30 secondes.","Danse sur une chanson choisie par l'autre.","Fais un massage des épaules de 2 minutes.","Écris un petit poème de 2 lignes pour l'autre.","Fais une grimace et prends-toi en photo.","Chante un refrain de ta chanson préférée.","Dis 3 choses que tu adores chez l'autre.","Prépare une boisson pour l'autre.","Donne un surnom ridicule à l'autre pour la journée."];
const VER=["Quel est ton plus beau souvenir de nous ?","Quelle est ta plus grande peur dans notre couple ?","Qu'as-tu pensé de moi la première fois ?","Quel est ton petit défaut que tu caches ?","Quelle est ta plus grosse bêtise ?","Quand as-tu su que tu m'aimais ?","Quel est ton rêve secret ?","Qu'est-ce qui t'a le plus fait rire chez moi ?","Quelle est la chose que tu n'oses pas me dire ?","Quel cadeau rêves-tu de recevoir ?","Quelle est ta plus grande fierté ?","Qu'est-ce qui te fait le plus craquer chez moi ?"];
let aov=null,aovH=[];
const typing=()=>document.activeElement&&document.activeElement.id==="aa_t";
function drawAov(){const c=aov,done=!!(c&&c.ans),mine=!!(c&&c.to===role),turn=c?c.turn:"";
 let h='<div class="big">'+(c?'<small class="mut">'+(c.type==="A"?"ACTION":"VÉRITÉ")+' · pour '+NAMES[c.to]+'</small><br>'+esc(c.text):"Choisis Action ou Vérité 😏")+'</div>';
 if(c&&!done){h+=mine?'<textarea id="aa_t" rows="3" placeholder="'+(c.type==="A"?"Raconte ce que tu as fait…":"Ta réponse…")+'"></textarea><div style="display:flex;gap:8px"><button class="btn" id="aa_s" style="flex:1">Envoyer</button>'+(c.type==="A"?'<button class="btn nv" id="aa_d" style="flex:1">Fait ✅</button>':"")+'</div>':'<p class="mut" style="text-align:center">En attente de la réponse de '+NAMES[c.to]+'… 💭</p>'}
 if(done)h+='<div class="card"><small>'+NAMES[c.to]+' a répondu</small><p>'+esc(c.ans)+'</p></div>';
 const canPick=(!c||done)&&(!turn||turn===role);
 if(canPick)h+='<div style="display:flex;gap:8px"><button class="btn" id="aa" style="flex:1">Action</button><button class="btn nv" id="av" style="flex:1">Vérité</button></div>';
 else if(done)h+='<p class="mut" style="text-align:center">À '+NAMES[turn]+' de piocher 🎲</p>';
 if(aovH.length)h+='<p class="mut" style="margin:10px 0 0"><b>Derniers tours</b></p>'+aovH.map(x=>'<div class="card"><small>'+(x.type==="A"?"Action":"Vérité")+' · '+NAMES[x.to]+'</small><p><i>'+esc(x.text)+'</i>\n'+esc(x.ans)+'</p></div>').join("");
 $("aov").innerHTML=h;
 const go=async t=>{const l=t==="A"?ACT:VER;try{await setDoc(doc(db,"game","aov"),{type:t,text:l[Math.floor(Math.random()*l.length)],from:role,to:other(),ans:"",turn:role,ts:Date.now()})}catch(e){err("Erreur.")}};
 if($("aa"))$("aa").onclick=()=>go("A");if($("av"))$("av").onclick=()=>go("V");
 const ans=async v=>{v=(v||"").trim();if(!v)return;try{await setDoc(doc(db,"game","aov"),{ans:v,turn:role},{merge:true});await addDoc(collection(db,"aov_hist"),{type:c.type,text:c.text,to:c.to,ans:v,ts:Date.now()})}catch(e){err("Réponse non envoyée.")}};
 if($("aa_s"))$("aa_s").onclick=()=>ans($("aa_t").value);
 if($("aa_d"))$("aa_d").onclick=()=>ans("Fait ✅")}
onSnapshot(doc(db,"game","aov"),sn=>{const d=sn.exists()?sn.data():null;aov=d&&d.to?d:null;if(typing())return;drawAov()},()=>{});
onSnapshot(query(collection(db,"aov_hist"),orderBy("ts","desc"),limit(6)),sn=>{aovH=sn.docs.map(d=>d.data());if(typing())return;drawAov()},()=>{});

/* Morpion */
let ttt={b:"         ",t:"H"};
const LN=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const win=b=>{for(const[a,c,d]of LN)if(b[a]!==" "&&b[a]===b[c]&&b[a]===b[d])return b[a];return null};
function drawTtt(){const w=win(ttt.b),full=!ttt.b.includes(" ");
 const st=w?(w==="X"?NAMES.H:NAMES.P)+" a gagné ! 🎉":full?"Match nul 🤝":(ttt.t===role?"À toi de jouer !":"Au tour de "+NAMES[ttt.t]);
 $("ttt").innerHTML='<div class="big">'+st+'</div><div class="ttt">'+ttt.b.split("").map((c,i)=>'<button data-c="'+i+'">'+(c===" "?"":c==="X"?"💙":"💗")+'</button>').join("")+'</div><button class="btn nv" id="tr" style="align-self:center">Nouvelle partie</button>';
 $("tr").onclick=()=>setDoc(doc(db,"game","ttt"),{b:"         ",t:"H"}).catch(()=>err("Erreur."))}
$("ttt").onclick=async e=>{const c=e.target.getAttribute&&e.target.getAttribute("data-c");if(c==null||!role)return;
 const i=+c;if(ttt.t!==role||ttt.b[i]!==" "||win(ttt.b))return;
 const b=ttt.b.slice(0,i)+(role==="H"?"X":"O")+ttt.b.slice(i+1);
 try{await setDoc(doc(db,"game","ttt"),{b,t:other()})}catch(x){err("Coup non envoyé.")}};
onSnapshot(doc(db,"game","ttt"),s=>{if(s.exists())ttt=s.data();else ttt={b:"         ",t:"H"};drawTtt()},()=>{});

/* Pierre-feuille-ciseaux */
const RE={r:"✊",p:"✋",c:"✌️"};
let rps={H:"",P:"",sH:0,sP:0};
const beats=(a,b)=>(a==="r"&&b==="c")||(a==="p"&&b==="r")||(a==="c"&&b==="p");
function drawRps(){const me=rps[role]||"",ot=rps[other()]||"";
 let h='<div class="sc">'+NAMES.H+' : <b>'+(rps.sH||0)+'</b> · '+NAMES.P+' : <b>'+(rps.sP||0)+'</b></div>';
 if(me&&ot){const w=me===ot?"Égalité 🤝":beats(me,ot)?"Tu gagnes la manche 🎉":"L'autre gagne la manche 😅";
  h+='<div class="big">'+RE[me]+' contre '+RE[ot]+'<br><small class="mut">'+w+'</small></div><button class="btn" id="rn">Manche suivante</button>'}
 else h+='<div class="big">'+(me?'Choix enregistré '+RE[me]+'<br><small class="mut">En attente de l\'autre… 💭</small>':"Fais ton choix")+'</div>'+(me?"":'<div class="rps"><button data-c="r">✊</button><button data-c="p">✋</button><button data-c="c">✌️</button></div>');
 h+='<button class="btn alt" id="rz">Remettre le score à zéro</button>';
 $("rps").innerHTML=h;
 if($("rn"))$("rn").onclick=()=>{const m=rps[role],o=rps[other()];let sH=rps.sH||0,sP=rps.sP||0;
  if(m&&o&&m!==o){if((role==="H")===beats(m,o))sH++;else sP++}
  setDoc(doc(db,"game","rps"),{H:"",P:"",sH,sP}).catch(()=>err("Erreur."))};
 $("rz").onclick=()=>setDoc(doc(db,"game","rps"),{H:"",P:"",sH:0,sP:0}).catch(()=>{})}
$("rps").onclick=e=>{const c=e.target.getAttribute&&e.target.getAttribute("data-c");if(!c||!role||rps[role])return;
 setDoc(doc(db,"game","rps"),{[role]:c},{merge:true}).catch(()=>err("Choix non envoyé."))};
onSnapshot(doc(db,"game","rps"),sn=>{rps=sn.exists()?{H:"",P:"",sH:0,sP:0,...sn.data()}:{H:"",P:"",sH:0,sP:0};drawRps()},()=>{});

/* Puissance 4 */
let c4={b:".".repeat(42),t:"H"};
const c4win=b=>{for(let r=0;r<6;r++)for(let c=0;c<7;c++){const v=b[r*7+c];if(v===".")continue;
 for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let k=1;while(k<4){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>5||cc<0||cc>6||b[rr*7+cc]!==v)break;k++}if(k===4)return v}}return null};
function drawC4(){const w=c4win(c4.b),full=!c4.b.includes(".");
 const st=w?NAMES[w]+" a gagné ! 🎉":full?"Match nul 🤝":(c4.t===role?"À toi de jouer !":"Au tour de "+NAMES[c4.t]);
 let cells="";for(let r=0;r<6;r++)for(let c=0;c<7;c++){const v=c4.b[r*7+c];cells+='<button data-col="'+c+'">'+(v==="H"?"💙":v==="P"?"💗":"")+'</button>'}
 $("c4").innerHTML='<div class="big">'+st+'</div><div class="gr c7">'+cells+'</div><button class="btn nv" id="cr">Nouvelle partie</button>';
 $("cr").onclick=()=>setDoc(doc(db,"game","c4"),{b:".".repeat(42),t:"H"}).catch(()=>{})}
$("c4").onclick=e=>{const c=e.target.getAttribute&&e.target.getAttribute("data-col");if(c==null||!role)return;
 if(c4.t!==role||c4win(c4.b))return;const col=+c;let r=5;while(r>=0&&c4.b[r*7+col]!==".")r--;if(r<0)return;
 const i=r*7+col,b=c4.b.slice(0,i)+role+c4.b.slice(i+1);
 setDoc(doc(db,"game","c4"),{b,t:other()}).catch(()=>err("Coup non envoyé."))};
onSnapshot(doc(db,"game","c4"),sn=>{c4=sn.exists()?sn.data():{b:".".repeat(42),t:"H"};drawC4()},()=>{});

/* Mémoire */
const MEMS=["🍓","🌹","🎧","🍕","🦋","⭐","🍩","🐱"];
let gm=null;
function newMem(){const d=[...MEMS,...MEMS];for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
 return setDoc(doc(db,"game","gmem"),{deck:d,open:[],matched:Array(16).fill(""),turn:role||"H"}).catch(()=>err("Erreur."))}
function flipBack(){if(!gm||!gm.open||gm.open.length!==2)return;setDoc(doc(db,"game","gmem"),{...gm,open:[],turn:gm.turn==="H"?"P":"H"}).catch(()=>{})}
function drawMem(){const el=$("gmem");
 if(!gm||!gm.deck){el.innerHTML='<div class="big">Retrouve les paires 🃏</div><button class="btn" id="gm_new">Commencer une partie</button>';$("gm_new").onclick=newMem;return}
 const sc={H:0,P:0};gm.matched.forEach(x=>{if(x)sc[x]+=.5});const over=gm.matched.every(x=>x);
 const st=over?(sc.H===sc.P?"Égalité 🤝":(sc.H>sc.P?NAMES.H:NAMES.P)+" gagne ! 🎉"):(gm.open.length===2?"Pas une paire…":(gm.turn===role?"À toi de jouer !":"Au tour de "+NAMES[gm.turn]));
 el.innerHTML='<div class="sc">'+NAMES.H+' : <b>'+sc.H+'</b> · '+NAMES.P+' : <b>'+sc.P+'</b></div><div class="big">'+st+'</div><div class="gr c4m">'+gm.deck.map((e,i)=>{const up=gm.open.includes(i)||gm.matched[i];return'<button data-m="'+i+'"'+(gm.matched[i]?' class="on"':"")+'>'+(up?e:"❓")+'</button>'}).join("")+'</div>'+(gm.open.length===2?'<button class="btn" id="gm_go">Continuer</button>':"")+'<button class="btn nv" id="gm_new">Nouvelle partie</button>';
 $("gm_new").onclick=newMem;if($("gm_go"))$("gm_go").onclick=flipBack}
$("gmem").onclick=e=>{const m=e.target.getAttribute&&e.target.getAttribute("data-m");if(m==null||!gm||!gm.deck||!role)return;
 const i=+m;if(gm.turn!==role||gm.open.length>=2||gm.open.includes(i)||gm.matched[i])return;
 const open=[...gm.open,i],matched=gm.matched.slice();
 if(open.length===2&&gm.deck[open[0]]===gm.deck[open[1]]){matched[open[0]]=role;matched[open[1]]=role;open.length=0}
 const two=open.length===2;
 setDoc(doc(db,"game","gmem"),{...gm,open,matched}).then(()=>{if(two)setTimeout(flipBack,1800)}).catch(()=>err("Coup non envoyé."))};
onSnapshot(doc(db,"game","gmem"),sn=>{gm=sn.exists()?sn.data():null;drawMem()},()=>{});

/* Bataille navale (grille 6x6, 6 bateaux) */
const BN=6,BS=6;
let bat={fH:[],fP:[],sH:[],sP:[],turn:""},batSel=[];
const hitsOf=(shots,fleet)=>shots.filter(x=>fleet.includes(x)).length;
const cellsHtml=(f,k,on)=>{let t="";for(let i=0;i<BN*BN;i++)t+='<button data-'+k+'="'+i+'"'+(on(i)?' class="on"':"")+'>'+f(i)+'</button>';return t};
function drawBat(){const o=other(),mf=bat["f"+role]||[],of=bat["f"+o]||[],ms=bat["s"+role]||[],os=bat["s"+o]||[];let h="";
 if(!mf.length)h='<div class="big">Place tes '+BS+' bateaux<br><small class="mut">Touche '+BS+' cases ('+batSel.length+'/'+BS+')</small></div><div class="gr c6">'+cellsHtml(i=>batSel.includes(i)?"🚢":"","bp",i=>batSel.includes(i))+'</div><button class="btn" id="bv"'+(batSel.length===BS?"":" disabled")+'>Valider ma flotte</button>';
 else if(!of.length)h='<div class="big">Flotte prête ✅<br><small class="mut">En attente de l\'autre… 💭</small></div>';
 else{const lost=hitsOf(os,mf)===BS,won=hitsOf(ms,of)===BS;
  const st=won?"Tu as gagné ! 🎉":lost?"Tu as perdu 😅":(bat.turn===role?"À toi de tirer !":"Au tour de "+NAMES[bat.turn]);
  h='<div class="big">'+st+'</div><p class="sc">Tirs sur l\'adversaire</p><div class="gr c6">'+cellsHtml(i=>ms.includes(i)?(of.includes(i)?"💥":"💧"):"","bt",()=>false)+'</div><p class="sc">Ma flotte</p><div class="gr c6">'+cellsHtml(i=>os.includes(i)?(mf.includes(i)?"💥":"💧"):(mf.includes(i)?"🚢":""),"bx",()=>false)+'</div>'}
 h+='<button class="btn alt" id="br">Nouvelle partie</button>';
 $("bat").innerHTML=h;
 if($("bv"))$("bv").onclick=validateFleet;
 $("br").onclick=()=>{batSel=[];setDoc(doc(db,"game","bat"),{fH:[],fP:[],sH:[],sP:[],turn:""}).catch(()=>{})}}
function validateFleet(){if(batSel.length!==BS||!role)return;const of=bat["f"+other()]||[];
 const d={["f"+role]:batSel.slice()};if(of.length)d.turn="H";
 setDoc(doc(db,"game","bat"),d,{merge:true}).then(()=>{batSel=[]}).catch(()=>err("Erreur."))}
$("bat").onclick=e=>{const t=e.target;if(!t.getAttribute||!role)return;
 const p=t.getAttribute("data-bp");
 if(p!=null){const i=+p,k=batSel.indexOf(i);if(k>=0)batSel.splice(k,1);else if(batSel.length<BS)batSel.push(i);drawBat();return}
 const q=t.getAttribute("data-bt");
 if(q!=null){const i=+q,o=other(),of=bat["f"+o]||[],mf=bat["f"+role]||[],ms=bat["s"+role]||[],os=bat["s"+o]||[];
  if(bat.turn!==role||ms.includes(i)||hitsOf(ms,of)===BS||hitsOf(os,mf)===BS)return;
  setDoc(doc(db,"game","bat"),{["s"+role]:[...ms,i],turn:of.includes(i)?role:o},{merge:true}).catch(()=>err("Tir non envoyé."))}};
onSnapshot(doc(db,"game","bat"),sn=>{bat={fH:[],fP:[],sH:[],sP:[],turn:"",...(sn.exists()?sn.data():{})};drawBat()},()=>{});

function renderAll(){drawMsgs();drawMems();drawDaily();drawQuiz();drawAov();drawTtt();drawRps();drawC4();drawMem();drawBat()}
renderAll();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
